<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            padding: 20px;
        }
        .thin { font-weight: 300; }
        .regular { font-weight: 400; }
        .medium { font-weight: 500; }
        .semi-bold { font-weight: 600; }
        .bold { font-weight: 700; }
    </style>
    <title>Poppins Font Example</title>
</head>
<body>
    <h1 class="thin">Poppins Thin - Home Page</h1>
    <h1 class="regular">Poppins Regular - About Page</h1>
    <h1 class="medium">Poppins Medium - Services Page</h1>
    <h1 class="semi-bold">Poppins Semi-Bold - Contact Page</h1>
    <h1 class="bold">Poppins Bold - Contact Page</h1>
</body>
</html>
